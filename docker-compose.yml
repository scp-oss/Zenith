# Только БД. Сам генератор (orchestrator) работает напрямую на хосте, не
# в контейнере — ему нужно вызывать set_strategy_cli.sh и трогать
# локальные файлы z2r_autobench, городить для этого сеть/пробросы внутрь
# контейнера ради одной команды смысла нет. Этот docker-compose нужен,
# только если выбран режим ZENITH_DB_MODE=docker (см. .env.example) —
# если БД уже есть где-то ещё, он вообще не запускается.
services:
  mysql:
    image: mysql:8.4
    container_name: zenith-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-change-me-root}"
      MYSQL_DATABASE: "${MYSQL_DATABASE:-z2r_genome}"
      MYSQL_USER: "${MYSQL_USER:-zenith}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:-change-me-app}"
    # MYSQL_BIND_HOST -- ОТДЕЛЬНАЯ переменная от MYSQL_HOST (тот -- адрес,
    # на который САМИ orchestrator/panel этого сервера коннектятся, обычно
    # 127.0.0.1, трогать не нужно). MYSQL_BIND_HOST -- на каком интерфейсе
    # слушает сам порт наружу. Дефолт 127.0.0.1 (безопасно, как раньше).
    # 0.0.0.0 -- только при включённом режиме 3 ("только центральная БД",
    # см. README "Прямое подключение ноды к центральной БД") -- ОБЯЗАТЕЛЬНО
    # вместе с db/mysql_node_allowlist.sh (иначе порт открыт всему
    # интернету) и учёткой не-root с ограниченными правами
    # (db/create_remote_db_user.sh), не общим MYSQL_USER/MYSQL_PASSWORD.
    ports:
      - "${MYSQL_BIND_HOST:-127.0.0.1}:${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
