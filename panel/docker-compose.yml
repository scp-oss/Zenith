# Caddy как reverse-proxy+TLS-терминатор перед панелью -- в Docker, а не
# системным пакетом (по прямому запросу: системный caddy может быть уже
# занят/задействован на боевом сервере чем-то ещё вне этого репо).
#
#   cp Caddyfile.example Caddyfile   # и подставь реальные HOSTNAME/PORT
#   sudo docker compose up -d
#
# network_mode: host обязателен, не опция на выбор -- панель слушает
# СТРОГО 127.0.0.1:8766 на хосте (см. panel/config.py::PANEL_HOST), а
# loopback хоста не виден контейнеру ни через обычный bridge+port-mapping,
# ни через host.docker.internal/host-gateway -- только сетевой неймспейс
# хоста даёт контейнеру доступ к 127.0.0.1 хоста без ослабления
# PANEL_HOST обратно на 0.0.0.0 (см. README "Публикация панели через
# Cloudflare").
services:
  caddy:
    image: caddy:2
    container_name: zenith-caddy
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /etc/caddy/cf-origin.pem:/etc/caddy/cf-origin.pem:ro
      - /etc/caddy/cf-origin-key.pem:/etc/caddy/cf-origin-key.pem:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
